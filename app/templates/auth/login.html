{% extends "base.html" %}
{% block content %}
<div class="bg-white rounded-2xl shadow-lg p-10 max-w-md mx-auto mt-6">
    <div class="text-center mb-8">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="TalibDrive" class="h-32 w-auto mx-auto my-4">
        <h2 class="text-2xl font-bold text-gray-800">🎓  Bienvenue 🎓</h2>
        <p class="text-gray-400 text-sm mt-1">Connectez-vous à votre compte TalibDrive</p>
    </div>
    <form method="POST" class="space-y-5">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email universitaire</label>
            <input type="email" name="email" required placeholder="vous@univ.ma"
                class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
        </div>
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
            <div class="relative">
                <input type="password" name="mot_de_passe" id="login-password" required placeholder="••••••••"
                    class="w-full border border-gray-200 rounded-xl px-4 py-2.5 pr-10 text-sm focus:outline-none focus:ring-2 focus:ring-green-500 bg-gray-50">
                <button type="button" id="toggle-login-password" tabindex="-1"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                    <svg id="eye-icon-login" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>
        <button type="submit"
            class="w-full bg-green-700 text-white py-2.5 rounded-xl hover:bg-green-800 transition font-semibold text-sm mt-2">
            Se connecter
        </button>
        <p class="text-center">
            <a href="{{ url_for('auth.mot_de_passe_oublie') }}" class="text-xs text-gray-400 hover:text-green-700 hover:underline">Mot de passe oublié ?</a>
        </p>
    </form>
    <p class="text-sm text-center mt-6 text-gray-400">Pas encore de compte ?
        <a href="{{ url_for('auth.inscription') }}" class="text-green-700 font-semibold hover:underline">S'inscrire</a>
    </p>
</div>

<script>
function setupPasswordToggle(inputId, buttonId, iconId) {
    const input = document.getElementById(inputId);
    const button = document.getElementById(buttonId);
    const icon = document.getElementById(iconId);

    const eyeOpen = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />`;

    const eyeClosed = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 3l18 18M10.584 10.587a2 2 0 002.828 2.83M9.363 5.365A9.466 9.466 0 0112 5c4.478 0 8.268 2.943 9.542 7a10.523 10.523 0 01-4.132 5.411M6.228 6.228A10.451 10.451 0 002.458 12c1.274 4.057 5.065 7 9.542 7 1.24 0 2.43-.223 3.529-.632" />`;

    button.addEventListener("click", () => {
        const isHidden = input.type === "password";
        input.type = isHidden ? "text" : "password";
        icon.innerHTML = isHidden ? eyeClosed : eyeOpen;
    });
}

setupPasswordToggle("login-password", "toggle-login-password", "eye-icon-login");
</script>
{% endblock %}
